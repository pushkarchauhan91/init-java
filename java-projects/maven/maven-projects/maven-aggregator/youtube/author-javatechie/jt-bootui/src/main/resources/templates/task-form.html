<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Task Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Task Manager</a>
        <a class="btn btn-outline-light btn-sm ms-auto" th:href="@{/ui/tasks}">Tasks</a>
    </div>
</nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white border-0 pb-0">
                    <h1 class="h4 mb-1" th:text="${pageTitle}">Task Form</h1>
                    <p class="text-muted mb-0">
                        Capture your task details, planned due date and actual done date.
                    </p>
                </div>
                <div class="card-body">
                    <form th:action="@{/ui/tasks/save}" th:object="${task}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title"
                                   th:field="*{title}" placeholder="e.g. Finish Spring Boot task manager"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="3"
                                      th:field="*{description}"
                                      placeholder="Additional details for this task"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="status" class="form-label">Status</label>
                                <select id="status" class="form-select" th:field="*{status}">
                                    <option th:each="st : ${statuses}"
                                            th:value="${st}"
                                            th:text="${st}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="dueDate" class="form-label">Due Date</label>
                                <input type="date" class="form-control" id="dueDate" th:field="*{dueDate}">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="doneDate" class="form-label">Done Date</label>
                                <input type="date" class="form-control" id="doneDate" th:field="*{doneDate}">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a class="btn btn-outline-secondary" th:href="@{/ui/tasks}">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                Save Task
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
