<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Task Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Task Manager</a>
        <a class="btn btn-outline-light btn-sm ms-auto" th:href="@{/ui/products}">Products</a>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div>
            <h1 class="h3 mb-0" th:text="${pageTitle}">Task Manager</h1>
            <p class="text-muted mb-0">Track your tasks with status and dates in real time.</p>
        </div>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-primary btn-lg shadow-sm" th:href="@{/ui/tasks/new}">
                Add Task
            </a>
        </div>
    </div>

    <form id="filterForm" class="bg-white shadow-sm rounded-3 p-3 mb-3" th:action="@{/ui/tasks}" method="get">
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label small text-muted">Status</label>
                <select class="form-select form-select-sm" name="status"
                        onchange="document.getElementById('filterForm').submit()">
                    <option th:value="" th:selected="${selectedStatus == null}">All</option>
                    <option th:each="st : ${statuses}"
                            th:value="${st}"
                            th:text="${st}"
                            th:selected="${selectedStatus == st}">
                    </option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted">Due date from</label>
                <input type="date" class="form-control form-control-sm" name="fromDue"
                       th:value="${fromDue}" onchange="document.getElementById('filterForm').submit()">
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted">Due date to</label>
                <input type="date" class="form-control form-control-sm" name="toDue"
                       th:value="${toDue}" onchange="document.getElementById('filterForm').submit()">
            </div>
            <div class="col-md-3 text-end">
                <button type="submit" class="btn btn-outline-secondary btn-sm">
                    Apply Filters
                </button>
            </div>
        </div>
    </form>

    <div class="bg-white shadow-sm rounded-3 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle table-borderless">
                <thead class="table-light">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Title</th>
                    <th scope="col">Status</th>
                    <th scope="col">Due Date</th>
                    <th scope="col">Done Date</th>
                    <th scope="col" class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(tasks)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        No tasks yet. Click "Add Task" to create your first one.
                    </td>
                </tr>
                <tr th:each="task : ${tasks}">
                    <td th:text="${task.id}">1</td>
                    <td>
                        <div class="fw-semibold" th:text="${task.title}">Sample task</div>
                        <div class="small text-muted text-truncate" style="max-width: 320px;"
                             th:text="${task.description}">Description</div>
                    </td>
                    <td>
                        <span class="badge px-3 py-2"
                              th:classappend="${task.status.name() == 'DONE'} ? ' text-bg-success' :
                                               (task.status.name() == 'IN_PROGRESS') ? ' text-bg-warning' : ' text-bg-secondary'"
                              th:text="${task.status}">
                            TODO
                        </span>
                    </td>
                    <td th:text="${task.dueDate}">2026-01-21</td>
                    <td th:text="${task.doneDate}">2026-01-22</td>
                    <td class="text-center">
                        <div class="btn-group" role="group">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{'/ui/tasks/edit/' + ${task.id}}">
                                Edit
                            </a>
                            <form th:action="@{'/ui/tasks/delete/' + ${task.id}}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Are you sure you want to delete this task?');">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
